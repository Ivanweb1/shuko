<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Консультации — Личный кабинет Schüco Home</title>
  <link rel="preload" href="assets/fonts/Stem_Medium.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/lk.css?v=6">
</head>
<body>

  <header class="lk-header">
    <div class="lk-header__in">
      <div class="lk-header__left">
        <button class="lk-burger" type="button" data-lk-burger aria-label="Меню кабинета" aria-expanded="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <a class="lk-logo" href="index.html">SchücoHome</a>
      </div>
      <div class="lk-header__right">
        <span class="lk-header__sep"></span>
        <a class="lk-icon-btn" href="lk-notifications.html" data-open-notif aria-label="Уведомления">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="lk-icon-btn__dot"></span>
        </a>
        <a class="lk-icon-btn" href="register.html" title="Регистрация / Выход" aria-label="Регистрация">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </a>
      </div>
    </div>
  </header>

  <div class="lk-shell">
    <aside class="lk-sidebar" data-lk-sidebar>
      <nav class="lk-nav" aria-label="Разделы кабинета">
        <a class="lk-nav__item" href="lk.html">
          <svg class="lk-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M7 20c1.2-2.6 3.1-4 5-4s3.8 1.4 5 4"/></svg>
          <span>Профиль компании</span>
        </a>
        <a class="lk-nav__item" href="lk-projects.html">
          <svg class="lk-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 4h16v12H4z"/><path d="M4 12h5l2 2h2l2-2h5"/><path d="M4 16v4h16v-4"/></svg>
          <span>Проекты</span>
        </a>
        <a class="lk-nav__item" href="systems.html">
          <svg class="lk-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 5h8a3 3 0 0 1 3 3v11a2 2 0 0 0-2-2H2V5Z"/><path d="M22 5h-8a3 3 0 0 0-3 3v11a2 2 0 0 1 2-2h9V5Z"/></svg>
          <span>База знаний</span>
        </a>
        <a class="lk-nav__item is-active" href="lk-chat.html">
          <svg class="lk-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.4 0-2.7-.3-3.9-.9L3 21l1.9-5.1A8.5 8.5 0 1 1 21 11.5Z"/></svg>
          <span>Консультации</span>
        </a>
      </nav>
      <div class="lk-user">
        <img class="lk-user__ava" src="assets/img/lk/ee1a910a001b.png" alt="">
        <div>
          <div class="lk-user__name">АлюмПроГрупп</div>
          <div class="lk-user__role">Производитель</div>
        </div>
      </div>
    </aside>

    <main class="lk-content">
      <section class="lk-chat" data-chat-app>
        <div class="lk-chat__list">
          <div>
            <h1 class="lk-chat__list-title">Обращения</h1>
            <div class="lk-chat__threads">
              <button class="lk-thread is-active" type="button" data-thread="support">
                <span class="lk-thread__ava">SH</span>
                <span class="lk-thread__body">
                  <span class="lk-thread__top">
                    <span class="lk-thread__name">Поддержка Schüco</span>
                    <span class="lk-thread__time">10:52</span>
                  </span>
                  <span class="lk-thread__bottom">
                    <span class="lk-thread__preview">Документ получен</span>
                  </span>
                </span>
              </button>

              <button class="lk-thread" type="button" data-thread="manager">
                <span class="lk-thread__ava">М</span>
                <span class="lk-thread__body">
                  <span class="lk-thread__top">
                    <span class="lk-thread__name">Менеджер Schüco</span>
                    <span class="lk-thread__time">10:52</span>
                  </span>
                  <span class="lk-thread__bottom">
                    <span class="lk-thread__preview">Документ получен</span>
                    <span class="lk-thread__unread">2</span>
                  </span>
                </span>
              </button>
            </div>
          </div>

          <button class="lk-btn lk-btn--lg lk-btn--primary lk-btn--full" type="button" onclick="document.querySelector('[data-chat-input]').focus()">Новый запрос</button>
        </div>

        <div class="lk-chat__main">
          <div class="lk-chat__head">
            <span class="lk-thread__ava" style="width:40px;height:40px;">SH</span>
            <div>
              <div class="lk-thread__name" data-chat-name>Поддержка Schüco</div>
              <div class="lk-thread__preview" data-chat-sub>Отвечает в течение часа</div>
            </div>
          </div>

          <div class="lk-chat__messages" data-chat-messages></div>

          <form class="lk-chat__compose" data-chat-form>
            <input type="text" data-chat-input placeholder="Напишите сообщение..." autocomplete="off">
            <button class="lk-btn lk-btn--primary" type="submit">Отправить</button>
          </form>
        </div>
      </section>
    </main>
  </div>

  <!-- Панель уведомлений -->
  <div class="lk-overlay" data-notif-drawer hidden>
    <div class="lk-notif-panel" data-notif-scope>
      <div class="lk-modal__head">
        <h2 class="lk-modal__title">Уведомления</h2>
        <button class="lk-modal__close" type="button" data-close-modal aria-label="Закрыть">×</button>
      </div>
      <div class="lk-tabs" style="padding:0;">
        <button class="lk-tab is-active" type="button" data-notif-tab="all">Все</button>
        <button class="lk-tab" type="button" data-notif-tab="projects">Проекты</button>
        <button class="lk-tab" type="button" data-notif-tab="chat">Консультации</button>
        <button class="lk-tab" type="button" data-notif-tab="docs">База знаний</button>
      </div>
      <div class="lk-notif-list">
        <article class="lk-notif" data-notif-item data-cat="chat">
          <div class="lk-notif__top"><span class="lk-notif__title">Ответ на консультацию</span><span class="lk-notif__meta">Сегодня, 12:00 <button class="lk-notif__del" type="button" data-notif-del>×</button></span></div>
          <div class="lk-notif__text">Специалист Schüco ответил на ваш вопрос по монтажу AWS 75 и приложил документацию.</div>
        </article>
      </div>
    </div>
  </div>

  <script src="js/lk.js?v=2"></script>
</body>
</html>
